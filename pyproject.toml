[project]
name = "audit-engine"
version = "0.1.0"
description = "Audit planning engine MVP — local prototype"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "evals"]
markers = [
    "llm: hits the live Anthropic API (deselected by default)",
    "eval: scenario evals against the live model (deselected by default)",
]
# live-model tests are opt-in: run them with `pytest -m llm` / `pytest -m eval`
addopts = "-m 'not llm and not eval'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
